[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "engineering-pulse-backend"
version = "0.1.0"
description = "Real-time dev workflow aggregator backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "aiokafka>=0.11.0",
    "asyncpg>=0.29.0",
    "redis[asyncio]>=5.0.0",
    "elasticsearch[async]>=8.13.0,<9.0.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.1",
    "alembic>=1.13.0",
    "boto3>=1.34.0",
    "apscheduler>=3.10.4",
    "slowapi>=0.1.9",
    "structlog>=24.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
    "locust>=2.29.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
