global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/alert.rules.yml"

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: fastapi
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000", "host.docker.internal:8000"]

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: kafka-jmx
    static_configs:
      - targets: ["kafka:7071"]
