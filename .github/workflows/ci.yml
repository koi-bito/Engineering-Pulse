name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend Lint & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: |
          ruff check . ../scripts

      - name: Run pytest suite
        run: |
          pytest tests -v

  frontend:
    name: Frontend Typecheck & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck and build
        run: npm run build

      - name: Run frontend unit tests
        run: node --experimental-strip-types --test tests/dashboard.test.ts

  docker:
    name: Docker Build & Compose Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate local Docker Compose
        run: docker compose config -q

      - name: Validate production Docker Compose
        env:
          S3_BUCKET_NAME: ep-raw-ci
          CORS_ORIGINS: https://example.cloudfront.net
          GITHUB_WEBHOOK_SECRET: ci-secret
          JIRA_WEBHOOK_SECRET: ci-secret
          GRAFANA_ADMIN_PASSWORD: ci-password
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/engineering_pulse
        run: docker compose -f docker-compose.prod.yml config -q

      - name: Build backend Docker image
        run: docker build -t engineering-pulse-backend:ci ./backend
